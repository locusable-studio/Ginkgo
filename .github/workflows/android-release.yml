name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - &checkout
        name: Check out the triggering commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c credential.helper= -c 'credential.https://github.com.helper=!gh auth git-credential' \
            fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - &version-check
        name: Check version metadata
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName = "([0-9.]+)"$/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq ">$version</text>" assets/badges/version.svg
          test -s ".github/release-notes/v$version.md"
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The tag must match versionName.' >&2
            exit 1
          fi
      - &compile
        name: Build and lint the release variant
        env:
          SDK_PLATFORM: android-37.0
          BUILD_TOOLS: '36.0.0'
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?JDK 17 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          if [[ ! -f "$ANDROID_HOME/platforms/$SDK_PLATFORM/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" ]]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdkmanager" ]]; then
              sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
            fi
            if [[ ! -x "$sdkmanager" ]]; then
              echo 'Android SDK command-line tools were not found on the runner.' >&2
              exit 1
            fi
            "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;$SDK_PLATFORM" "build-tools;$BUILD_TOOLS"
          fi
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - *checkout
      - *version-check
      - *compile
      - name: Sign and verify the release APK
        env:
          GINKGO_RELEASE_KEYSTORE: ${{ secrets.GINKGO_RELEASE_KEYSTORE }}
          GINKGO_RELEASE_PASSWORD: ${{ secrets.GINKGO_RELEASE_PASSWORD }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?JDK 17 is required}"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          version=${GITHUB_REF_NAME#v}
          code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' app/build.gradle.kts)
          [[ "$code" =~ ^[1-9][0-9]*$ ]]
          if [[ -z "$GINKGO_RELEASE_KEYSTORE" || -z "$GINKGO_RELEASE_PASSWORD" ]]; then
            echo 'Both Ginkgo release signing secrets are required.' >&2
            exit 1
          fi
          mkdir -p dist
          apk="dist/Ginkgo-$version.apk"
          printf '%s' "$GINKGO_RELEASE_KEYSTORE" | base64 --decode | "$tools/apksigner" sign \
            --ks /dev/stdin --ks-type PKCS12 --ks-key-alias ginkgo \
            --ks-pass env:GINKGO_RELEASE_PASSWORD --v4-signing-enabled false \
            --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
          certificate=$("$tools/apksigner" verify --print-certs "$apk" | sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: //p')
          if [[ "$certificate" != 86edb3c85b94e869a90336cd683dcd7ddd38f3e2efcb39d9be6f0cfcf87a5bb3 ]]; then
            echo 'The APK is not signed with the existing Ginkgo release certificate.' >&2
            exit 1
          fi
          badging=$("$tools/aapt" dump badging "$apk")
          grep -Fq "package: name='com.locusable.ginkgo' versionCode='$code' versionName='$version'" <<< "$badging"
          grep -Fxq "sdkVersion:'27'" <<< "$badging"
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo 'Refusing to publish a debuggable APK.' >&2
            exit 1
          fi
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version=${tag#v}
          gh release create "$tag" "dist/Ginkgo-$version.apk" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Ginkgo $version" --notes-file ".github/release-notes/$tag.md"
